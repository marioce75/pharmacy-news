services:
  - type: web
    name: pharmacy-news
    runtime: node
    buildCommand: node scripts/check-runtime.js && npm ci
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: TZ
        value: UTC
      - key: CONTENT_DIR
        value: /opt/render/project/src/content
      - key: RUN_SCHEDULED_JOBS
        value: "false"
      - key: ALLOW_COLLECTION
        value: "false"
      - key: ALLOW_MODEL_CALLS
        value: "false"
      - key: RUN_NEWS_SCHEDULE
        value: "false"
      - key: RUN_ANTIBIOTIC_SCHEDULE
        value: "false"
      - key: ALLOW_ANTIBIOTIC_WATCH
        value: "false"
    disk:
      name: content-data
      mountPath: /opt/render/project/src/content
      sizeGB: 1
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
